<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmDirect | Dairy</title>
    <link href="./src/output.css" rel="stylesheet">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
</head>

<body>
    <main class="bg-stone-50 pb-20">
        <header class="bg-gradient-to-r from-blue-700 to-sky-500 py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10">
            </div>
            <div class="max-w-7xl mx-auto relative z-10 text-center">
                <h1 class="text-4xl md:text-5xl font-black text-white mb-4">Fresh Dairy</h1>
                <p class="text-blue-100 text-lg font-medium max-w-2xl mx-auto">Pure, unadulterated milk and artisanal
                    dairy
                    products from local pastures.</p>
            </div>
        </header>

        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 relative z-20">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

                <!-- Dairy Card 1 -->
                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/milk.avif" alt="Milk"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-blue-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Cow Milk</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Sourced from Green Pastures in Anand</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹80</span>
                                <span class="text-stone-500 font-semibold">/liter</span>
                            </div>
                            <button
                                class="w-full bg-gradient-to-r from-blue-500 to-sky-500 hover:from-blue-600 hover:to-sky-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Dairy Card 2 -->
                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/panner.jpg" alt="Cheese"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-blue-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Fresh Paneer</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Made by Dairy Co-op in Kolhapur</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹350</span>
                                <span class="text-stone-500 font-semibold">/kg</span>
                            </div>
                            <button
                                class="w-full bg-gradient-to-r from-blue-500 to-sky-500 hover:from-blue-600 hover:to-sky-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/ghee.jpg" alt="Cheese"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-blue-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Ghee</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Made by pure cow milk</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹250</span>
                                <span class="text-stone-500 font-semibold">/kg</span>
                            </div>
                            <button
                                class="w-full bg-gradient-to-r from-blue-500 to-sky-500 hover:from-blue-600 hover:to-sky-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/butter.jpg" alt="Cheese"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-blue-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Butter</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Made by Dairy in Ahmadabad</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹450</span>
                                <span class="text-stone-500 font-semibold">/kg</span>
                            </div>
                            <button
                                class="w-full bg-gradient-to-r from-blue-500 to-sky-500 hover:from-blue-600 hover:to-sky-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>
</body>

</html>
