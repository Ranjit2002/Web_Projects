<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmDirect | Fruits</title>
    <link href="./src/output.css" rel="stylesheet">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <main class="bg-stone-50 pb-20">
        <header
            class="bg-gradient-to-r from-orange-700 to-rose-500 py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10">
            </div>
            <div class="max-w-7xl mx-auto relative z-10 text-center">
                <h1 class="text-4xl md:text-5xl font-black text-white mb-4">Seasonal Fruits</h1>
                <p class="text-orange-100 text-lg font-medium max-w-2xl mx-auto">Sweet, juicy, and naturally ripened
                    under the sun.</p>
            </div>
        </header>

        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 relative z-20">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

                <!-- Fruit Card 1 -->
                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/apple.jpg" alt="Apples"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-rose-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Kinnaur Apples</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Grown by Singh Orchards in Shimla</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹140</span>
                                <span class="text-stone-500 font-semibold">/kg</span>
                            </div>
                            <button onclick="addToCart('Kinnaur Apples', 140, 'img/apple.jpg')"
                                class="w-full bg-gradient-to-r from-orange-500 to-rose-600 hover:from-orange-600 hover:to-rose-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Fruit Card 2 -->
                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/banana.jpg" alt="Bananas"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-rose-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Robusta Bananas</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Grown by Kerala Farms in Kochi</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹50</span>
                                <span class="text-stone-500 font-semibold">/dozen</span>
                            </div>
                            <button onclick="addToCart('Robusta Bananas', 50, 'img/banana.jpg')"
                                class="w-full bg-gradient-to-r from-orange-500 to-rose-600 hover:from-orange-600 hover:to-rose-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Fruit Card 3 -->
                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/mango.jpg" alt="Mangoes"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-rose-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Mangoes</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Grown in Ratnagiri</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹200</span>
                                <span class="text-stone-500 font-semibold">/kg</span>
                            </div>
                            <button onclick="addToCart('Mangoes', 200, 'img/mango.jpg')"
                                class="w-full bg-gradient-to-r from-orange-500 to-rose-600 hover:from-orange-600 hover:to-rose-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Fruit Card 4 -->
                <div
                    class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300 border border-stone-100 flex flex-col group">
                    <div class="relative h-64 overflow-hidden bg-stone-200">
                        <img src="img/grapes.jpg" alt="Grapes"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-rose-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <h3 class="font-bold text-2xl text-stone-900 mb-2">Grapes</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">Fresh grapes from farms</p>
                        <div class="flex flex-col gap-4">
                            <div>
                                <span class="text-3xl font-black text-stone-900">₹150</span>
                                <span class="text-stone-500 font-semibold">/kg</span>
                            </div>
                            <button onclick="addToCart('Grapes', 150, 'img/grapes.jpg')"
                                class="w-full bg-gradient-to-r from-orange-500 to-rose-600 hover:from-orange-600 hover:to-rose-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition-transform active:scale-95">
                                <i class="fa-solid fa-basket-shopping"></i> Add to Basket
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- ADD THIS SCRIPT TAG FOR THE CART TO WORK -->
    <script src="script.js"></script>
</body>

</html>
