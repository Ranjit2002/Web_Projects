<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Emerald to Cyan Gradient -->
        <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        
        <!-- Soft Glow Effect -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Dark Circular Background matching bg-gray-950 -->
    <circle cx="256" cy="256" r="256" fill="#0f172a" />
    
    <!-- 'R' Monogram / Modern Armchair Hybrid -->
    <g stroke="url(#brand-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
        
        <!-- Backrest (Spine of the R) -->
        <line x1="200" y1="120" x2="200" y2="320" />
        
        <!-- Seat Cushion -->
        <line x1="200" y1="320" x2="320" y2="320" />
        
        <!-- Armrest (The Loop of the R) -->
        <path d="M 200 180 h 80 c 38.66 0 70 31.34 70 70 c 0 38.66 -31.34 70 -70 70" />
        
        <!-- Back Leg -->
        <line x1="200" y1="320" x2="150" y2="400" />
        
        <!-- Front Leg (The tail of the R) -->
        <line x1="280" y1="320" x2="330" y2="400" />
        
    </g>
</svg>
