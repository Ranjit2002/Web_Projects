<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <title>Document</title>
</head>

<body class="">

    <header>

        <nav class="p-3 bg-white flex justify-between items-center">
            <a href="#" class="flex gap-2 items-center">
                <img src="img/logo.png" alt="logo" class="object-cover max-w-12 max-h-12">
                <span class="text-lg font-medium font-serif">ToDesktop</span>
            </a>

            <div id="nav-menu" class="hidden lg:flex gap-12">
                <a href="#" class="font-medium hover:text-primary">Pricing</a>
                <a href="#" class="font-medium hover:text-primary">Docs</a>
                <a href="#" class="font-medium hover:text-primary">Changelog</a>
                <a href="#" class="font-medium hover:text-primary">Blogs</a>
                <a href="#" class="font-medium hover:text-primary">Login</a>
            </div>

            <button
                class="hidden lg:flex gap-2 items-center border-2 border-gray-400 px-6 py-2 rounded-xl hover:border-gray-600">
                <img src="img/electron2.png" alt="electron" class="w-7 h-7">
                <span>Electron Developers</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <button class="p-2 lg:hidden" onclick="handleMenu()">
                <i class="fa-solid fa-bars text-gray-600"></i>
            </button>

            <div id="nav-dialog" class="hidden fixed z-10 md:hidden bg-white inset-0 p-3">
                <div class="nav-bar flex justify-between">
                    <a href="#" class="flex gap-2 items-center">
                        <img src="img/logo.png" alt="logo" class="object-cover max-w-12 max-h-12">
                        <span class="text-lg font-medium font-serif">ToDesktop</span>
                    </a>
                    <button class="p-2 md:hidden" onclick="handleMenu()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="mt-6">
                    <a href="#" class="font-medium m-3 p-3 hover:bg-gray-50 block rounded-lg">Pricing</a>
                    <a href="#" class="font-medium m-3 p-3 hover:bg-gray-50 block rounded-lg">Docs</a>
                    <a href="#" class="font-medium m-3 p-3 hover:bg-gray-50 block rounded-lg">Changelog</a>
                    <a href="#" class="font-medium m-3 p-3 hover:bg-gray-50 block rounded-lg">Blogs</a>
                    <a href="#" class="font-medium m-3 p-3 hover:bg-gray-50 block rounded-lg">Login</a>
                </div>
                <div class="h-[1px] bg-gray-300"></div>
                <button class="w-full mt-6 flex gap-2 items-center px-6 py-4 rounded-xl hover:bg-gray-50">
                    <img src="img/electron2.png" alt="electron" class="w-7 h-7">
                    <span>Electron Developers</span>
                </button>
            </div>
        </nav>
    </header>

    <main>

        <div id="hero" class="min-h-screen bg-gradient-to-br from-purple-50 via bg-orange-50 to-transparent">
            <div id="hero-container" class="max-w-4xl mx-auto px-6 pb-32 flex flex-col">
                <div id="version-text"
                    class="flex items-center my-6 gap-2 border border-yellow-300 bg-yellow-50 rounded-lg px-3 py-1 w-fit shadow-md hover:shadow-lg hover:-translate-y-1 duration-300 ease-initial group">
                    <div class="w-2 h-2 bg-yellow-400 rounded-full border border-yellow-600"></div>
                    <p class="font-display font-medium text-yellow-600">v0.21.1: <span
                            class="text-yellow-800">Find-in-page bug fixes</span>
                    </p>
                    <i
                        class="fa-solid fa-arrow-right text-yellow-600 group-hover:translate-x-1 transition-transform duration-300"></i>
                </div>
                <h1>Web app to desktop app in 10 minutes</h1>
                <p>Take your web app codebase and transform it into a cross platform desktop app with native
                    functionlity.</p>
                <div class="button-container flex flex-col">
                    <button>Download now</button>
                    <button>Read Docs</button>
                </div>
            </div>
        </div>

    </main>



    <script src="script.js"></script>

</body>

</html>
